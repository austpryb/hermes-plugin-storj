name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q __init__.py schemas.py tools.py uplink.py test_plugin.py
      - name: Validate manifest
        run: |
          python -m pip install --quiet pyyaml
          python -c "
          import yaml
          m = yaml.safe_load(open('plugin.yaml'))
          assert m['name'] == 'storj', m['name']
          assert len(m['provides_tools']) == 10
          import importlib.util, sys, pathlib
          spec = importlib.util.spec_from_file_location('p', '__init__.py', submodule_search_locations=['.'])
          mod = importlib.util.module_from_spec(spec); sys.modules['p'] = mod; spec.loader.exec_module(mod)
          assert {s['name'] for s in mod.schemas.ALL} == set(m['provides_tools'])
          print('manifest matches schemas')
          "
      - name: Offline tests
        run: python test_plugin.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff
      - run: ruff check .
      - run: ruff format --check .
